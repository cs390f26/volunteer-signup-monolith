openapi: 3.0.3
info:
  title: Volunteer Signup API
  description: |
    HTTP API for creating and browsing one-day volunteer events, viewing
    time-based shifts for each role, and signing up for an available shift.

    Each event has a date and between one and ten roles. Each role has between
    one and fifty shifts, and each shift has a start time and end time. A shift
    can be filled by exactly one volunteer. No account, sign-in, or identity
    verification is required.

    Events, roles, and shifts cannot be modified or deleted after creation.
    A completed signup cannot be replaced through this API.
  version: 1.0.0

paths:
  /events:
    get:
      summary: List events
      description: |
        Returns all event summaries ordered newest first. Each summary includes
        the event's roles and the number of open shifts for each role.
      operationId: listEvents
      responses:
        '200':
          description: All event summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              examples:
                withEvents:
                  summary: Existing events
                  value:
                    events:
                      - id: k7m2xq9p
                        name: Community Cleanup
                        description: Neighborhood cleanup event
                        date: '2026-10-10'
                        roles:
                          - number: 1
                            label: Registration
                            openShifts: 2
                          - number: 2
                            label: Cleanup Crew
                            openShifts: 3
                empty:
                  summary: No events
                  value:
                    events: []
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create an event
      description: |
        Creates a one-day volunteer event with its roles and shifts from a JSON
        request body. Roles and shifts are assigned 1-based numbers in request
        order.

        Text values are trimmed before validation. The event must contain
        between one and ten roles, and each role must contain between one and
        fifty shifts. Every shift must have a start time earlier than its end
        time. If creation fails, the event never appears in the event list or
        any other response.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              name: Community Cleanup
              description: Neighborhood cleanup event
              date: '2026-10-10'
              roles:
                - label: Registration
                  shifts:
                    - startTime: '09:00'
                      endTime: '11:00'
                    - startTime: '11:00'
                      endTime: '13:00'
                - label: Cleanup Crew
                  shifts:
                    - startTime: '09:00'
                      endTime: '12:00'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                id: k7m2xq9p
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /events/{eventId}/roles/{roleNumber}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RoleNumber'
    get:
      summary: Get role details
      description: |
        Returns one role from an event, including its shifts in creation order.
        Each shift includes its start time, end time, availability, and the
        submitted volunteer name when the shift has been taken.
      operationId: getRole
      responses:
        '200':
          description: Role found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDetails'
              example:
                eventId: k7m2xq9p
                eventName: Community Cleanup
                eventDate: '2026-10-10'
                number: 1
                label: Registration
                shifts:
                  - number: 1
                    startTime: '09:00'
                    endTime: '11:00'
                    available: false
                    volunteerName: Alex Morgan
                  - number: 2
                    startTime: '11:00'
                    endTime: '13:00'
                    available: true
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /events/{eventId}/roles/{roleNumber}/shifts/{shiftNumber}/signup:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/RoleNumber'
      - $ref: '#/components/parameters/ShiftNumber'
    post:
      summary: Sign up for a shift
      description: |
        Records a volunteer name on an available shift. The submitted name is
        trimmed and must be between 1 and 100 characters.

        The update succeeds only if the shift is still available. An existing
        volunteer name is never overwritten. If two requests attempt to take
        the same shift, only the first successful request is recorded.
      operationId: signupForShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              name: Alex Morgan
      responses:
        '200':
          description: Signup recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
              example:
                number: 1
                startTime: '09:00'
                endTime: '11:00'
                available: false
                volunteerName: Alex Morgan
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /health:
    get:
      summary: Health check
      description: |
        Returns whether the service can accept traffic, including a check that
        the database is reachable.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '503':
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unavailable

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      description: |
        Unique event identifier. A value that does not match the pattern
        returns 404.
      schema:
        $ref: '#/components/schemas/EventId'
      example: k7m2xq9p

    RoleNumber:
      name: roleNumber
      in: path
      required: true
      description: 1-based role number within the event
      schema:
        type: integer
        minimum: 1
        maximum: 10
      example: 1

    ShiftNumber:
      name: shiftNumber
      in: path
      required: true
      description: 1-based shift number within the role
      schema:
        type: integer
        minimum: 1
        maximum: 50
      example: 2

  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidEvent:
              summary: Invalid event data
              value:
                error:
                  code: BAD_REQUEST
                  message: Each shift must have a start time earlier than its end time
            invalidName:
              summary: Invalid volunteer name
              value:
                error:
                  code: BAD_REQUEST
                  message: name must contain between 1 and 100 characters

    NotFound:
      description: The requested event, role, or shift does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Requested resource not found

    Conflict:
      description: The shift has already been taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SHIFT_TAKEN
              message: Shift is no longer available

    ServerError:
      description: The server could not complete the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unable to complete the request

  schemas:
    EventId:
      type: string
      pattern: '^[a-z0-9]{8}$'
      description: Unique event identifier, 8 lowercase letters and digits
      example: k7m2xq9p

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - BAD_REQUEST
            - NOT_FOUND
            - SHIFT_TAKEN
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable explanation of the error

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    CreateShiftRequest:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Shift start time in 24-hour HH:MM format
          example: '09:00'
        endTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: |
            Shift end time in 24-hour HH:MM format. It must be later than
            startTime.
          example: '11:00'

    CreateRoleRequest:
      type: object
      required:
        - label
        - shifts
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          description: Role label shown to volunteers
          example: Registration
        shifts:
          type: array
          minItems: 1
          maxItems: 50
          description: Shifts in display order
          items:
            $ref: '#/components/schemas/CreateShiftRequest'

    CreateEventRequest:
      type: object
      required:
        - name
        - description
        - date
        - roles
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Event name shown to volunteers
          example: Community Cleanup
        description:
          type: string
          minLength: 1
          maxLength: 280
          description: Short description of the event
          example: Neighborhood cleanup event
        date:
          type: string
          format: date
          description: Event date in YYYY-MM-DD format
          example: '2026-10-10'
        roles:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Roles in display order. Role labels must be unique within the event
            after surrounding whitespace is removed.
          items:
            $ref: '#/components/schemas/CreateRoleRequest'

    CreateEventResponse:
      type: object
      description: Identifier of the newly created event
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/EventId'

    RoleSummary:
      type: object
      required:
        - number
        - label
        - openShifts
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 10
          description: 1-based role number within the event
        label:
          type: string
          description: Role label
        openShifts:
          type: integer
          minimum: 0
          maximum: 50
          description: Number of shifts that are still available

    EventSummary:
      type: object
      required:
        - id
        - name
        - description
        - date
        - roles
      properties:
        id:
          $ref: '#/components/schemas/EventId'
        name:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        roles:
          type: array
          minItems: 1
          maxItems: 10
          description: Roles in display order
          items:
            $ref: '#/components/schemas/RoleSummary'

    EventListResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          description: All events ordered newest first
          items:
            $ref: '#/components/schemas/EventSummary'

    Shift:
      type: object
      required:
        - number
        - startTime
        - endTime
        - available
      properties:
        number:
          type: integer
          minimum: 1
          maximum: 50
          description: 1-based shift number within the role
        startTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Shift start time in 24-hour HH:MM format
        endTime:
          type: string
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]$'
          description: Shift end time in 24-hour HH:MM format
        available:
          type: boolean
          description: Whether the shift can still be selected
        volunteerName:
          type: string
          minLength: 1
          maxLength: 100
          description: Submitted volunteer name; included only when taken

    RoleDetails:
      type: object
      required:
        - eventId
        - eventName
        - eventDate
        - number
        - label
        - shifts
      properties:
        eventId:
          $ref: '#/components/schemas/EventId'
        eventName:
          type: string
        eventDate:
          type: string
          format: date
        number:
          type: integer
          minimum: 1
          maximum: 10
          description: 1-based role number within the event
        label:
          type: string
          description: Role label
        shifts:
          type: array
          minItems: 1
          maxItems: 50
          description: Shifts in creation order
          items:
            $ref: '#/components/schemas/Shift'

    SignupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Volunteer name to record on the shift. Surrounding whitespace is
            removed before validation and storage.
          example: Jordan Lee