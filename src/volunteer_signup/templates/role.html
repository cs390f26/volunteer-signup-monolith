<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Role</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="/">
          Volunteers
          <span class="brand-tag">Find a role. Pick a time. Show up.</span>
        </a>
        <div class="header-actions">
          <a class="btn btn-primary" href="/">All events</a>
          <a class="btn btn-primary" href="/create">Create event</a>
        </div>
      </header>

      <p class="page-status" id="page-error" hidden></p>

      <article class="panel detail-panel" id="role-panel" hidden>
        <header class="detail-header">
          <h1 class="detail-title" id="role-title"></h1>
          <p class="event-date" id="event-date"></p>
          <p class="detail-copy" id="event-name"></p>
        </header>

        <h2 class="section-label">Time slots</h2>
        <ul class="choice-list" id="shift-list"></ul>
      </article>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("eventId");
      const roleNumber = params.get("roleNumber");
      const pageError = document.getElementById("page-error");
      const panel = document.getElementById("role-panel");
      const shiftList = document.getElementById("shift-list");

      function showError(message) {
        pageError.hidden = false;
        pageError.textContent = message;
        panel.hidden = true;
      }

      function formatDate(isoDate) {
        const parts = isoDate.split("-").map(Number);
        if (parts.length !== 3 || parts.some((part) => Number.isNaN(part))) {
          return isoDate;
        }
        const date = new Date(parts[0], parts[1] - 1, parts[2]);
        return date.toLocaleDateString(undefined, {
          weekday: "long",
          month: "long",
          day: "numeric",
        });
      }

      function formatTime(value) {
        const match = /^(\d{2}):(\d{2})$/.exec(value);
        if (!match) return value;
        let hours = Number(match[1]);
        const minutes = match[2];
        const suffix = hours >= 12 ? "PM" : "AM";
        hours = hours % 12;
        if (hours === 0) hours = 12;
        return hours + ":" + minutes + " " + suffix;
      }

      if (!eventId || !roleNumber) {
        showError("Missing role.");
      } else {
        (async function load() {
          const response = await fetch(
            "/events/" +
              encodeURIComponent(eventId) +
              "/roles/" +
              encodeURIComponent(roleNumber)
          );
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            showError(
              (data.error && data.error.message) || "Role not found."
            );
            return;
          }

          document.title = data.label;
          document.getElementById("role-title").textContent = data.label;
          document.getElementById("event-date").textContent = formatDate(
            data.eventDate
          );
          document.getElementById("event-name").textContent = data.eventName;

          shiftList.replaceChildren();
          for (const shift of data.shifts) {
            const li = document.createElement("li");
            const label =
              formatTime(shift.startTime) + " – " + formatTime(shift.endTime);
            if (shift.available) {
              const link = document.createElement("a");
              link.className = "choice";
              link.href =
                "/confirm?eventId=" +
                encodeURIComponent(eventId) +
                "&roleNumber=" +
                encodeURIComponent(roleNumber) +
                "&shiftNumber=" +
                encodeURIComponent(shift.number);
              link.append(document.createTextNode(label + " "));
              const meta = document.createElement("span");
              meta.className = "choice-meta";
              meta.textContent = "Open";
              link.appendChild(meta);
              li.appendChild(link);
            } else {
              const taken = document.createElement("span");
              taken.className = "choice is-occupied";
              taken.setAttribute("aria-disabled", "true");
              taken.append(document.createTextNode(label + " "));
              const meta = document.createElement("span");
              meta.className = "choice-meta";
              meta.textContent = shift.volunteerName || "Taken";
              taken.appendChild(meta);
              li.appendChild(taken);
            }
            shiftList.appendChild(li);
          }
          panel.hidden = false;
        })();
      }
    </script>
  </body>
</html>
