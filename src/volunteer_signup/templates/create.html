<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <a class="brand" href="/">
          Volunteers
          <span class="brand-tag">Find a role. Pick a time. Show up.</span>
        </a>
        <div class="header-actions">
          <a class="btn btn-primary" href="/">All events</a>
        </div>
      </header>

      <div class="create-form">
        <div class="create-box">
          <h1 class="detail-title">Create an event</h1>
          <p class="page-status" id="form-error" hidden></p>

          <div class="field">
            <label for="event-title">Event title</label>
            <input
              id="event-title"
              name="title"
              type="text"
              value=""
              autocomplete="off"
            />
          </div>

          <div class="field">
            <label for="event-description">Description</label>
            <textarea id="event-description" name="description"></textarea>
          </div>

          <div class="field">
            <label for="event-date">Date</label>
            <input
              id="event-date"
              name="date"
              type="text"
              value=""
              autocomplete="off"
              placeholder="YYYY-MM-DD"
            />
          </div>

          <fieldset class="roles-fieldset">
            <legend>Roles</legend>
            <div id="roles-fields"></div>
          </fieldset>

          <div class="create-add">
            <button
              class="btn btn-primary btn-icon"
              type="button"
              id="add-role"
              aria-label="Add role"
            >
              +
            </button>
          </div>
        </div>

        <div class="create-actions">
          <a class="btn btn-primary" href="/">Cancel</a>
          <button class="btn btn-primary" type="button" id="create-btn">
            Create
          </button>
        </div>
      </div>
    </div>
    <script>
      const rolesFields = document.getElementById("roles-fields");
      const addRoleBtn = document.getElementById("add-role");
      const createBtn = document.getElementById("create-btn");
      const formError = document.getElementById("form-error");
      let roleCount = 0;

      function showError(message) {
        formError.hidden = false;
        formError.textContent = message;
      }

      function clearError() {
        formError.hidden = true;
        formError.textContent = "";
      }

      function toHHMM(token) {
        const trimmed = token.trim();
        const as24 = /^([01]?\d|2[0-3]):([0-5]\d)$/.exec(trimmed);
        if (as24) {
          return as24[1].padStart(2, "0") + ":" + as24[2];
        }
        const as12 = /^(\d{1,2}):([0-5]\d)\s*([AaPp][Mm])$/.exec(trimmed);
        if (!as12) return null;
        let hours = Number(as12[1]);
        const minutes = as12[2];
        const meridiem = as12[3].toUpperCase();
        if (hours < 1 || hours > 12) return null;
        if (meridiem === "AM") {
          if (hours === 12) hours = 0;
        } else if (hours !== 12) {
          hours += 12;
        }
        return String(hours).padStart(2, "0") + ":" + minutes;
      }

      function parseSlot(text) {
        const parts = text.split(/\s*[–-]\s*/);
        if (parts.length !== 2) return null;
        const startTime = toHHMM(parts[0]);
        const endTime = toHHMM(parts[1]);
        if (!startTime || !endTime) return null;
        return { startTime, endTime };
      }

      function refreshRoleControls() {
        const cards = rolesFields.querySelectorAll(".role-card");
        cards.forEach((card, index) => {
          card.querySelector(".role-card-title").textContent =
            "Role " + (index + 1);
          const removeRole = card.querySelector("[data-remove-role]");
          if (removeRole) removeRole.hidden = cards.length <= 1;
          const slots = card.querySelectorAll('input[name="role-slot"]');
          const rows = card.querySelectorAll(".slots-fields .field");
          rows.forEach((row) => {
            const btn = row.querySelector("[data-remove-shift]");
            if (btn) btn.hidden = slots.length <= 1;
          });
          const addShift = card.querySelector("[data-add-shift]");
          if (addShift) addShift.hidden = slots.length >= 50;
        });
        addRoleBtn.hidden = cards.length >= 10;
      }

      function addShiftRow(card, focus) {
        const slots = card.querySelector(".slots-fields");
        if (slots.querySelectorAll(".field").length >= 50) return;
        const n = slots.querySelectorAll(".field").length + 1;
        const slotId = card.dataset.roleId + "-slot-" + n;
        const row = document.createElement("div");
        row.className = "field field-with-action";
        row.innerHTML =
          '<label class="visually-hidden" for="' +
          slotId +
          '">Time slot ' +
          n +
          "</label>" +
          '<input id="' +
          slotId +
          '" name="role-slot" type="text" value="" autocomplete="off" placeholder="8:00 AM – 9:00 AM" />' +
          '<button class="btn btn-primary btn-icon" type="button" data-remove-shift aria-label="Remove time slot">−</button>';
        row.querySelector("[data-remove-shift]").addEventListener("click", () => {
          if (slots.querySelectorAll(".field").length <= 1) return;
          row.remove();
          refreshRoleControls();
        });
        slots.appendChild(row);
        refreshRoleControls();
        if (focus) row.querySelector("input").focus();
      }

      function addRoleCard(focus) {
        if (rolesFields.querySelectorAll(".role-card").length >= 10) return;
        roleCount += 1;
        const roleId = "role-" + roleCount;
        const card = document.createElement("div");
        card.className = "role-card";
        card.dataset.roleId = roleId;
        const titleId = roleId + "-title";
        const descriptionId = roleId + "-description";
        card.innerHTML =
          '<div class="role-card-head">' +
          '<h2 class="role-card-title">Role</h2>' +
          '<button class="btn btn-primary btn-icon" type="button" data-remove-role aria-label="Remove role">−</button>' +
          "</div>" +
          '<div class="field">' +
          '<label for="' +
          titleId +
          '">Title</label>' +
          '<input id="' +
          titleId +
          '" name="role-title" type="text" value="" autocomplete="off" />' +
          "</div>" +
          '<div class="field">' +
          '<label for="' +
          descriptionId +
          '">Description</label>' +
          '<textarea id="' +
          descriptionId +
          '" name="role-description"></textarea>' +
          "</div>" +
          '<fieldset class="slots-fieldset">' +
          "<legend>Time slots</legend>" +
          '<div class="slots-fields"></div>' +
          "</fieldset>" +
          '<div class="create-add">' +
          '<button class="btn btn-primary btn-icon" type="button" data-add-shift aria-label="Add time slot">+</button>' +
          "</div>";
        card.querySelector("[data-remove-role]").addEventListener("click", () => {
          if (rolesFields.querySelectorAll(".role-card").length <= 1) return;
          card.remove();
          refreshRoleControls();
        });
        card.querySelector("[data-add-shift]").addEventListener("click", () => {
          addShiftRow(card, true);
        });
        rolesFields.appendChild(card);
        addShiftRow(card, false);
        refreshRoleControls();
        if (focus) card.querySelector('input[name="role-title"]').focus();
      }

      addRoleBtn.addEventListener("click", () => addRoleCard(true));
      addRoleCard(false);

      createBtn.addEventListener("click", async () => {
        clearError();
        const name = document.getElementById("event-title").value.trim();
        const description = document
          .getElementById("event-description")
          .value.trim();
        const date = document.getElementById("event-date").value.trim();

        if (!name) {
          showError("Enter an event title.");
          return;
        }
        if (name.length > 100) {
          showError("Event title must be at most 100 characters.");
          return;
        }
        if (!description) {
          showError("Enter a description.");
          return;
        }
        if (description.length > 280) {
          showError("Description must be at most 280 characters.");
          return;
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
          showError("Enter a date as YYYY-MM-DD.");
          return;
        }

        const roles = [];
        for (const card of rolesFields.querySelectorAll(".role-card")) {
          const label = card
            .querySelector('input[name="role-title"]')
            .value.trim();
          if (!label) {
            showError("Each role needs a title.");
            return;
          }
          if (label.length > 100) {
            showError("Each role title must be at most 100 characters.");
            return;
          }
          const shifts = [];
          for (const input of card.querySelectorAll('input[name="role-slot"]')) {
            const text = input.value.trim();
            if (!text) {
              showError("Each time slot needs a start and end time.");
              return;
            }
            const slot = parseSlot(text);
            if (!slot) {
              showError(
                "Enter each time slot as start – end, for example 8:00 AM – 9:00 AM."
              );
              return;
            }
            if (slot.startTime >= slot.endTime) {
              showError("Each time slot's start must be earlier than its end.");
              return;
            }
            shifts.push(slot);
          }
          if (shifts.length < 1 || shifts.length > 50) {
            showError("Each role must have between 1 and 50 time slots.");
            return;
          }
          roles.push({ label, shifts });
        }

        if (roles.length < 1 || roles.length > 10) {
          showError("Provide between 1 and 10 roles.");
          return;
        }
        const labels = roles.map((role) => role.label);
        if (new Set(labels).size !== labels.length) {
          showError("Role titles must be distinct.");
          return;
        }

        const response = await fetch("/events", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, description, date, roles }),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          showError(
            (data.error && data.error.message) || "Could not create the event."
          );
          return;
        }
        window.location.href = "/";
      });
    </script>
  </body>
</html>
